<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4e7d2e">
<title>Registro Escolar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <select id="courseSel" aria-label="Curso"></select>
    <button id="btnSync" class="icon-btn" data-s="off" aria-label="Sincronización" title="Sincronización">☁</button>
    <button id="btnMenu" class="icon-btn" aria-label="Menú">⋮</button>
  </div>
  <nav class="tabs">
    <button data-tab="asistencia" class="active">Asistencia</button>
    <button data-tab="practicas">Prácticas</button>
    <button data-tab="estudiantes">Estudiantes</button>
  </nav>
</header>

<main id="main"></main>

<div id="menu" class="menu hidden">
  <button data-act="curso-datos">Datos del curso</button>
  <button data-act="curso-nuevo">Nuevo curso</button>
  <button data-act="export-xlsx">Exportar a Excel (.xlsx)</button>
  <button data-act="export-json">Copia de seguridad (.json)</button>
  <button data-act="import-json">Restaurar copia de seguridad</button>
  <button data-act="curso-borrar" class="danger">Eliminar este curso</button>
</div>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" class="toast hidden"></div>

<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
